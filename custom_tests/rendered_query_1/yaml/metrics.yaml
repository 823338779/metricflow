metric:
  name: bookings
  type: simple
  type_params:
    expr: "1"
    metric_aggregation_params:
      semantic_model: bookings_source
      agg: sum
---
metric:
  name: listings
  type: simple
  type_params:
    expr: "1"
    metric_aggregation_params:
      semantic_model: listings_latest
      agg: sum
---
metric:
  name: bookings_per_listing
  type: ratio
  type_params:
    numerator:
      name: bookings
    denominator:
      name: listings
