semantic_model:
  name: listings_latest
  node_relation:
    schema_name: $source_schema
    alias: dim_listings_latest
  defaults:
    agg_time_dimension: ds
  measures:
    - name: listings
      expr: 1
      agg: sum
  dimensions:
    - name: ds
      type: time
      expr: created_at
      type_params:
        time_granularity: day
    - name: country_latest
      type: categorical
      expr: country
    - name: is_lux_latest
      type: categorical
      expr: is_lux
  entities:
    - name: listing
      type: primary
      expr: listing_id
