semantic_model:
  name: order_detail
  node_relation:
    schema_name: $source_schema
    alias: order_detail
  defaults:
    agg_time_dimension: ordered_on
  dimensions:
    - name: ordered_on
      type: time
      expr: ordered_at
      type_params:
        time_granularity: day
    - name: order_status
      type: categorical
      expr: status
    - name: sales_channel
      type: categorical
      expr: channel
  entities:
    - name: order_line
      type: primary
      expr: order_line_id
    - name: user
      type: foreign
      expr: user_id
    - name: product
      type: foreign
      expr: product_id
    - name: store
      type: foreign
      expr: store_id
