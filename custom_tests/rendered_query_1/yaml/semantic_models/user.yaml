semantic_model:
  name: user
  node_relation:
    schema_name: $source_schema
    alias: user
  defaults:
    agg_time_dimension: registered_on
  dimensions:
    - name: registered_on
      type: time
      expr: created_at
      type_params:
        time_granularity: day
    - name: region
      type: categorical
      expr: region
    - name: vip_flag
      type: categorical
      expr: is_vip
  entities:
    - name: user
      type: primary
      expr: user_id
